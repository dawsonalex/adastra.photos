{{ define "main" }}
  <div class="aa-page">
    {{ partial "header.html" . }}
    <h1>{{ .Title }}</h1>
    {{ .Content }}
    {{ range .Pages }}
      <article>
        <h2><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h2>
        {{ .Summary }}
      </article>
    {{ end }}
  </div>
{{ end }}
