baseURL = 'https://adastra.photos/'
languageCode = 'en-US'
title = 'Ad Astra'
enableRobotsTXT = true

[params]
    # Used for <meta name="description"> on the homepage and as the default
    # Open Graph / Twitter description site-wide.
    description = 'Backyard deep-sky astrophotography by Alex Dawson — Andromeda, Cygnus, the Moon and more, captured with a Canon DSLR and a Star Adventurer tracker.'

    # Author / creator credit, surfaced in JSON-LD and meta tags.
    author = 'Alex Dawson'

    # Default Open Graph image (relative to /static) used on pages that don't
    # have a bundled capture image. 1200x630 recommended.
    ogImage = 'img/og-default.webp'

    # Default Bortle reading shown in the "Sky" row when a capture omits its own.
    defaultBortleScale = 6

    # Gear constants. Per-capture front matter (capture_camera, capture_mount)
    # overrides these.
    [params.gear]
        camera = 'Canon EOS 550D'
        mount  = 'SkyWatcher Star Adventurer 2i EQ'
        optics = 'Carl Zeiss 135mm f/3.5'

    # Order in which acquisition details render on a capture page. Each inner
    # list is one visual group (rendered as a key/value table with a heading).
    captureDetailKeys = [
        [
            "date",
            "location",
            "bortle_scale",
            "ra_hms",
        ],
        [
            "camera",
            "focal_length",
            "exposure",
            "iso",
            "f_number",
        ],
        [
            "mount",
        ],
        [
            "frames",
        ],
    ]

[taxonomies]
object = 'objects'
tag = 'tags'

[module]
[module.hugoVersion]
extended = false
min = '0.151.0'
